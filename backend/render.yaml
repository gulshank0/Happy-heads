# Render Blueprint - Happy Heads Backend
# =======================================
# Deploy with: Connect your GitHub repo to Render
# This creates a web service and PostgreSQL database

services:
  # Web Service - Node.js Backend
  - type: web
    name: happy-heads-backend
    runtime: node
    region: oregon # Change to your preferred region
    plan: free # Options: free, starter, standard, pro
    
    # Build Configuration
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    
    # Health Check
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: happy-heads-db
          property: connectionString
      # These must be set manually in Render Dashboard
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

    # Disk for file uploads (optional - only on paid plans)
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

databases:
  - name: happy-heads-db
    plan: free # Options: free, starter, standard, pro
    databaseName: happy_heads
    user: happy_heads_user
    region: oregon
