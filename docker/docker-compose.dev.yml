# =============================================================================
# Docker Compose - Development Overrides
# =============================================================================
# Extends docker-compose.yml with development-specific configuration.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend - Development Mode
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DEBUG: "*"
    volumes:
      - ../Backend/src:/app/src:ro
      - ../Backend/prisma:/app/prisma:ro
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "9229:9229"  # Node.js debugger

  # ---------------------------------------------------------------------------
  # Frontend - Development Mode (Vite HMR)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ../Frontend/src:/app/src:ro
      - ../Frontend/public:/app/public:ro
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: ["pnpm", "run", "dev", "--host", "0.0.0.0"]

  # ---------------------------------------------------------------------------
  # pgAdmin - Database Management (Dev Only)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: happy-heads-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@happyheads.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Redis Commander - Redis UI (Dev Only)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: happy-heads-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

# Additional dev volumes
volumes:
  pgadmin_data:
    driver: local
