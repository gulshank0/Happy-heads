# =============================================================================
# Docker Compose Development Overrides
# =============================================================================
# Development-specific configuration with hot-reload and debugging support
# 
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 
# Features:
# - Source code volume mounts for hot-reload
# - Exposed debug ports
# - Verbose logging
# - No resource limits
# =============================================================================

services:
  # ===========================================================================
  # Backend - Development Configuration
  # ===========================================================================
  backend:
    # Override build for development
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    
    # Development environment
    environment:
      NODE_ENV: development
      DEBUG: "*"
    
    # Mount source code for hot-reload
    volumes:
      - ./Backend/src:/app/src:ro
      - ./Backend/prisma:/app/prisma:ro
      - uploads_data:/app/uploads
    
    # Expose debug port for Node.js inspector
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "9229:9229"  # Node.js debugger

  # ===========================================================================
  # Frontend - Development Configuration
  # ===========================================================================
  frontend:
    # Override build for development
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    
    # Mount source code for hot-reload
    volumes:
      - ./Frontend/src:/app/src:ro
      - ./Frontend/public:/app/public:ro
    
    # Vite dev server port
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    
    # Override command to run dev server
    command: ["pnpm", "run", "dev", "--host", "0.0.0.0"]

  # ===========================================================================
  # pgAdmin - Database Management UI (Development Only)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: happy-heads-pgadmin
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@happyheads.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    
    ports:
      - "5050:5050"
    
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - happy-heads-network

  # ===========================================================================
  # Redis Commander - Redis Management UI (Development Only)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: happy-heads-redis-commander
    restart: unless-stopped
    
    environment:
      REDIS_HOSTS: local:redis:6379
    
    ports:
      - "8081:8081"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - happy-heads-network

# Additional volumes for development tools
volumes:
  pgadmin_data:
    driver: local
